plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    
    String TAG = ""
    String semVer = "1.0.0"
    
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             
            return ("LOCAL-" + "${getDate()}")
        }else {
            
            TAG_STRING =  'kollegen-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            storeFile file("aamc_upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "android_github_release"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "dev.kollegen.client.android"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 10000000
        versionName getVersionName()
        multiDexEnabled true 
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Kollegen"
            resValue "string", "app_short_name", "Kollegen"
            resValue 'string', 'application_package', 'dev.kollegen.client.android.debug'
            resValue 'string', 'storageProviderAuthorities', 'dev.kollegen.client.android.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'dev.kollegen.client.android.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customRelease
            
            
            
            resValue "string", "app_name", "Kollegen"
            resValue "string", "app_short_name", "Kollegen"
            resValue 'string', 'storageProviderAuthorities', 'dev.kollegen.client.android.scoped.gamefolder'
            resValue 'string', 'application_package', 'dev.kollegen.client.android'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            
            
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

